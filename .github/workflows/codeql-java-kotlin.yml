name: CodeQL (Java/Kotlin)

# Extract the production JVM compilation with the project Kotlin compiler.

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true
          db-location: ${{ runner.temp }}/codeql-db

      - name: Build Java/Kotlin extraction target
        run: ./gradlew --no-daemon clean compileKotlinJvm --rerun-tasks --no-build-cache --no-configuration-cache

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:java-kotlin"

      - name: Verify extracted production Kotlin
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: |
          "$CODEQL" pack install tools/codeql-pilot
          "$CODEQL" query run tools/codeql-pilot/production-files.ql --database="${{ runner.temp }}/codeql-db/java" --output="${{ runner.temp }}/production-files.bqrs"
          "$CODEQL" bqrs decode "${{ runner.temp }}/production-files.bqrs" --format=csv --output="${{ runner.temp }}/production-files.csv"
          cat "${{ runner.temp }}/production-files.csv"
          grep -F 'src/commonMain/kotlin/ai/solace/tui/roff/Roff.kt' "${{ runner.temp }}/production-files.csv"

      - name: Retain extraction and analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-codeql-evidence
          path: |
            ${{ runner.temp }}/production-files.csv
            ${{ runner.temp }}/codeql-db/java/codeql-database.yml
            ${{ runner.temp }}/codeql-db/java/src.zip
            ${{ steps.analyze.outputs.sarif-output }}
